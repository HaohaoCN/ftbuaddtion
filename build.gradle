plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    // 无需额外 Mixin 插件
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    modularity.inferModulePath = false
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            jvmArg "-Xmx2G"
            jvmArg "--add-opens=java.base/java.lang=ALL-UNNAMED"
            jvmArg "--add-opens=java.base/java.util=ALL-UNNAMED"
            jvmArg "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// ===== 解决模块冲突 =====
configurations {
    runtimeClasspath.extendsFrom = []
    runtimeClasspath.extendsFrom(implementation, runtimeOnly)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.ftb.dev/snapshots"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    maven {
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 只保留 Mixin 注解处理器，用于生成 RefMap；运行时由 Forge 提供
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // FTB 依赖 - 编译时使用 compileOnly
    // 运行时需要手动将以下 jars 放到 run/mods 目录：
    //   - ftb-ultimine-forge-${ftb_ultimine_version}.jar
    //   - ftb-library-forge-2001.2.13.jar
    //   - architectury-forge-9.0.8.jar
    compileOnly fg.deobf("dev.ftb.mods:ftb-ultimine-forge:${ftb_ultimine_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-library-forge:2001.2.13")

    // Architectury - 编译时引用 API
    compileOnly fg.deobf("dev.architectury:architectury-forge:9.0.8")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
            ftb_ultimine_version: ftb_ultimine_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 关键：声明您的 Mixin 配置和 RefMap
                "MixinConfigs"            : "ftbuaddtion.mixins.json",
                "MixinRefMap"             : "ftbuaddtion.refmap.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}